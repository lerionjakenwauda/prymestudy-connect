name: Connect Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NODE_VERSION="$(node -p "require('./sdk/typescript/package.json').version")"
          PYTHON_VERSION="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$VERSION" = "$NODE_VERSION"
          test "$VERSION" = "$PYTHON_VERSION"
          grep -F "## [$VERSION] -" CHANGELOG.md >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run credential guard
        run: python scripts/security_scan.py

      - name: Validate protocol
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema openapi-spec-validator
          check-jsonschema --check-metaschema schemas/*.json
          openapi-spec-validator openapi/connect-v1.yaml

      - name: Validate Packagist root package
        run: composer validate --strict composer.json

      - name: Test PHP SDK
        working-directory: sdk/php
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --no-interaction
          composer test

      - name: Test and package TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install --no-fund
          npm audit --audit-level=high
          npm test
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist

      - name: Audit, test and package Python SDK
        run: |
          python -m pip install --disable-pip-version-check build pip-audit
          python - <<'PY' > /tmp/prymestudy-connect-requirements.txt
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text(encoding='utf-8'))
          print('\n'.join(data['project']['dependencies']))
          PY
          pip-audit --strict -r /tmp/prymestudy-connect-requirements.txt
          python -m pip install --disable-pip-version-check ./sdk/python
          python -m unittest discover -s sdk/python/tests -v
          python -m build --outdir dist sdk/python

      - name: Package PHP SDK and protocol bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/prymestudy-connect-php-${VERSION}.tar.gz" -C sdk/php \
            --exclude=vendor \
            --exclude=.phpunit.cache \
            .
          tar -czf "dist/prymestudy-connect-protocol-${VERSION}.tar.gz" \
            README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md composer.json \
            docs openapi schemas examples
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "PrymeStudy Connect $GITHUB_REF_NAME"
