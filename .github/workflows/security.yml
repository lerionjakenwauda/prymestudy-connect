name: Connect Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: connect-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-guard:
    name: Credential guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/security_scan.py

  php-audit:
    name: PHP dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Install PHP SDK dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit PHP dependencies
        working-directory: sdk/php
        run: composer audit --no-interaction

  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm install --no-fund
      - name: Audit Node dependencies
        working-directory: sdk/typescript
        run: npm audit --audit-level=high

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build dependency audit input
        run: |
          python - <<'PY' > /tmp/prymestudy-connect-requirements.txt
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text(encoding='utf-8'))
          print('\n'.join(data['project']['dependencies']))
          PY
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --strict -r /tmp/prymestudy-connect-requirements.txt

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
