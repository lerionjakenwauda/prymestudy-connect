name: Connect CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    name: Protocol schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/academic-claims.schema.json >/dev/null
          python -m json.tool schemas/launch-request.schema.json >/dev/null
          python -m json.tool schemas/webhook-event.schema.json >/dev/null
      - name: Validate JSON Schema metaschemas
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema
          check-jsonschema --check-metaschema schemas/*.json

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Validate package
        working-directory: sdk/php
        run: composer validate --strict
      - name: Install dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find sdk/php/src -name '*.php' -print0 | xargs -0 -n1 php -l

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package.json
      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: sdk/typescript
        run: npm run typecheck
      - name: Build
        working-directory: sdk/typescript
        run: npm run build

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Compile package
        run: python -m compileall -q sdk/python/prymestudy_connect
