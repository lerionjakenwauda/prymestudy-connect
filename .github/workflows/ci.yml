name: Connect CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol and schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/academic-claims.schema.json >/dev/null
          python -m json.tool schemas/launch-request.schema.json >/dev/null
          python -m json.tool schemas/webhook-event.schema.json >/dev/null
      - name: Validate JSON Schema metaschemas and OpenAPI
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema openapi-spec-validator
          check-jsonschema --check-metaschema schemas/*.json
          openapi-spec-validator openapi/connect-v1.yaml

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Validate package
        working-directory: sdk/php
        run: composer validate --strict
      - name: Install dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find sdk/php/src sdk/php/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        working-directory: sdk/php
        run: composer test

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: sdk/typescript
        run: npm run typecheck
      - name: Tests and build
        working-directory: sdk/typescript
        run: npm test

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: python -m pip install --disable-pip-version-check ./sdk/python
      - name: Compile package
        run: python -m compileall -q sdk/python/prymestudy_connect
      - name: Tests
        run: python -m unittest discover -s sdk/python/tests -v
