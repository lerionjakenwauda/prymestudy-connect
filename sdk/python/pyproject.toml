[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prymestudy-connect"
version = "1.0.0"
description = "Official Python SDK for PrymeStudy Connect institutional integrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["prymestudy_connect"]
